[project]
name = "upwork-radar"
version = "0.1.0"
description = "Deterministic job triage and proposal pipeline for Upwork studios: score, route, lint, notify."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martin Morfe" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
