# Concept flags from the playbook (H1..H5). Detected here, used by mode/hook choice.
flags:
  H1: [hand-painted, hand painted, watercolor, hand-drawn, hand drawn, painterly, real artist, no ai]
  H2: [luxury, high-end, heritage, premium, editorial, not cartoonish]
  H3: [branding, logo, packaging, merch, album cover, book cover, print-ready, vector]
  H4: [embroidery, wilcom, dst, apparel, cap, polo, tech pack, factory]
  H5: [memorial, wedding, family, faith, storytelling, tribute]

# Words that signal a desired outcome (not a task): force full mode.
full_mode_terms:
  - creative direction
  - brand identity
  - launch
  - collection
  - vision
  - from scratch
  - long-term
  - complete
