# Lane dictionaries. Weights are summed (title hits x title_multiplier) and divided by
# `saturation` to get a 0-1 strength. Terms match whole words, case-insensitive, with
# optional plural and "-"/space variants ("ui animation" matches "UI-animations").

saturation: 8
min_strength: 0.25
title_multiplier: 2

lanes:
